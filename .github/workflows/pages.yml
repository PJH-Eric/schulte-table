# 把 public/ 佈署到 GitHub Pages，並在建置時注入 GAME_SERVER_URL
name: 佈署前端到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game_server_url:
        description: '遊戲伺服器網址（留空就用下面的 DEFAULT_GAME_SERVER_URL）'
        required: false
        type: string

env:
  # 遊戲伺服器網址：優先序為 手動執行時填的 inputs → repo Variable GAME_SERVER_URL → 這個預設值。
  # 線上後端目前是 Cloudflare Worker；網址未設定（空字串）時注入腳本會擋下，避免誤部署。
  DEFAULT_GAME_SERVER_URL: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"

      - name: 跑測試
        run: npm test

      - name: 畫面與導覽檢查（flow／interaction，需 playwright 與本機伺服器）
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3120/health && break; sleep 1; done
          node scripts/flow-check.cjs
          node scripts/interaction-check.cjs

      - name: 注入伺服器網址
        env:
          GAME_SERVER_URL: ${{ inputs.game_server_url || vars.GAME_SERVER_URL || env.DEFAULT_GAME_SERVER_URL }}
        run: node scripts/inject-server-url.js

      - uses: actions/configure-pages@v5
      - name: 驗證並注入 GA4 與 SEO
        run: node scripts/inject-seo.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
