# Cloudflare 後端（目前唯一的線上後端；Render 免費額度已滿）。只放後端（WebSocket + /health），前端在 GitHub Pages。
# 建置：cd cloudflare && npm ci && node build-worker.cjs；部署：在根目錄執行 wrangler deploy
name = "schulte-table-backup"
main = "cloudflare/dist/worker.mjs"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "GameLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameLobby"]

[observability]
enabled = true
head_sampling_rate = 1
